# N64Recomp configuration. Inputs are generated from your ROM by
# tools/gen_recomp.py into build/recomp-input/.
[input]
entrypoint = 0x80000400
symbols_file_path = "../build/recomp-input/syms.toml"
rom_file_path = "../build/recomp-input/image.bin"
output_func_path = "../build/RecompiledFuncs"
uses_mips3_float_mode = false

[patches]
# Functions the recompiler can't translate yet. Most are low-level libultra
# routines (cache maintenance, CPU control registers, interrupt handling) that
# the PC runtime replaces with its own versions, so they are skipped here and
# will be renamed to their libultra names as they're identified.
stubs = [
    "func_800031F0",
    "func_80003280",
    "func_800032A0",
    "func_80003344",
    "func_80003C24",
    "func_80003E64",
    "func_80005120",
    "func_80005350",
    "func_80005400",
    "func_80008498",
    "func_80009DF0",
    "func_80009EA0",
    "func_8000A0E0",
    "bootup_023300",
