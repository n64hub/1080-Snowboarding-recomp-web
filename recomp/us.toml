# N64Recomp configuration. Inputs are generated from your ROM by
# tools/gen_recomp.py into build/recomp-input/.
[input]
entrypoint = 0x80000400
symbols_file_path = "../build/recomp-input/syms.toml"
rom_file_path = "../build/recomp-input/image.bin"
output_func_path = "../build/RecompiledFuncs"
uses_mips3_float_mode = false

[patches]
# Kernel functions the recompiler can't translate. func_80003280 through
# func_80009EA0 are the kernel's interrupt and exception handlers, which the
# PC runtime replaces; func_80008498 pokes the RSP status register directly.
stubs = [
    "func_80003280",
    "func_800032A0",
    "func_80003344",
    "func_80003C24",
    "func_80008498",
    "func_80009EA0",
]
