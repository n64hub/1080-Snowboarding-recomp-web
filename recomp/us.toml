# N64Recomp configuration. tools/recompile.sh copies this into
# build/recomp-input/ next to the inputs gen_recomp.py makes from your ROM,
# appends the generated hooks.toml, and runs N64Recomp there, so paths are
# relative to build/recomp-input/.
[input]
entrypoint = 0x80000400
symbols_file_path = "syms.toml"
rom_file_path = "image.bin"
output_func_path = "../RecompiledFuncs"
uses_mips3_float_mode = false
# game_reloc.h makes references into unloaded modules resolve to 0.
recomp_include = "#include \"recomp.h\"\n#include \"game_reloc.h\""

[patches]
# Kernel functions the recompiler can't translate. func_80003280 through
# func_80009EA0 are the kernel's interrupt and exception handlers, which the
# PC runtime replaces; func_80008498 pokes the RSP status register directly.
stubs = [
    "func_80003280",
    "func_800032A0",
    "func_80003344",
    "func_80003C24",
    "func_80008498",
    "func_80009EA0",
]

# The game reads the cartridge with its own copies of osPiRawStartDma. Do the
# read directly instead of poking PI registers.
# IPL3 stores the CIC id at 0x80000310 (osCicId). The game refuses to boot
# ("Security Check: FAIL") unless it is 6103, so set it as the boot code would.
# game_boot_residue() recreates other words IPL3 leaves behind that the game
# checks later (src/game/boot_residue.cpp).
[[patches.hook]]
func = "recomp_entrypoint"
text = "    MEM_W(0, (gpr)(int32_t)0x80000310) = 6103; { void game_boot_residue(uint8_t*); game_boot_residue(rdram); }"

# The kernel's module loader (func_80001994) and unloader (func_8000717C)
# update the slot table. Module code can use a freshly loaded module right after
# the call returns, before any kernel function-pointer call syncs the runtime,
# so sync on the way out of both as well.
[[patches.hook]]
func = "func_80001994"
before_vram = 0x80001BAC
text = "    { void game_sync_modules(uint8_t*); game_sync_modules(rdram); }"

[[patches.hook]]
func = "func_8000717C"
before_vram = 0x80007354
text = "    { void game_sync_modules(uint8_t*); game_sync_modules(rdram); }"

# The task scheduler (bootup_061CF4) asks the RSP to yield the graphics task
# when an audio task is due, and starts the audio task (kept in $s6) once the
# RSP reports back. On hardware that comes within microseconds; the runtime
# ignores yields, so the report can arrive after the next retrace, which would
# overwrite $s6 (with 0 when no new audio task is pending) and start a null
# task. While a yield is pending ($s4), leave $s6 alone.
[[patches.hook]]
func = "bootup_061CF4"
before_vram = 0x81061F1C
text = "    if (ctx->r20 != 0) goto L_81061F80;"

# The game busy-waits with osYieldThread. The runtime's threads only receive
# interrupt messages (VI, SP, SI) when they wait, so let them through here.
[[patches.hook]]
func = "osYieldThread_kernel"
text = "    { void game_yield_thread(uint8_t*); game_yield_thread(rdram); return; }"

[[patches.hook]]
func = "osYieldThread_bootup"
text = "    { void game_yield_thread(uint8_t*); game_yield_thread(rdram); return; }"

[[patches.hook]]
func = "osPiRawStartDma_kernel"
text = "    { void game_pi_raw_dma(uint8_t*, recomp_context*); game_pi_raw_dma(rdram, ctx); return; }"

[[patches.hook]]
func = "osPiRawStartDma_bootup"
text = "    { void game_pi_raw_dma(uint8_t*, recomp_context*); game_pi_raw_dma(rdram, ctx); return; }"

# Draw distance (src/game/draw_distance.cpp).
# The land object picks which rows of the course grid to draw each frame and
# stores the first and last row in the camera (+0x10C, +0x110).
[[patches.hook]]
func = "bootup_0063B4"
before_vram = 0x810066FC
text = "    { void game_draw_rows(uint8_t*, recomp_context*); game_draw_rows(rdram, ctx); }"

# Far plane passed to the camera's perspective function ($f4, stored as the
# stack argument), and its field of view in degrees ($a1, src/game/camera.cpp).
[[patches.hook]]
func = "bootup_0634B0"
before_vram = 0x81063510
text = "    { float game_far_scale(void); ctx->f4.fl *= game_far_scale(); } { void game_fov(recomp_context*); game_fov(ctx); }"

# Distance limits for positioned objects: the camera scales its base cull
# distances by $f0 (85 / fov) every frame.
[[patches.hook]]
func = "bootup_0631C0"
before_vram = 0x81063254
text = "    { float game_cull_scale(void); ctx->f0.fl *= game_cull_scale(); }"

# Rider shadow (src/game/shadows.cpp). The shadow direction has just been
# normalized into $sp + 0x58 when the call returns.
[[patches.hook]]
func = "bootup_069370"
before_vram = 0x81069464
text = "    { void game_shadow_direction(uint8_t*, recomp_context*); game_shadow_direction(rdram, ctx); }"

# The rider's shadow is drawn between these two points: the caller is about
# to build the shadow matrix, and it has just finished the shadow's draws.
[[patches.hook]]
func = "bootup_00CFA0"
before_vram = 0x8100D204
text = "    { void game_shadow_draw_begin(uint8_t*, recomp_context*); game_shadow_draw_begin(rdram, ctx); }"

[[patches.hook]]
func = "bootup_00CFA0"
before_vram = 0x8100D3B8
text = "    { void game_shadow_draw_end(uint8_t*, recomp_context*); game_shadow_draw_end(rdram, ctx); }"

# The shadow matrix has just been built from the ground plane.
[[patches.hook]]
func = "bootup_069370"
before_vram = 0x810694BC
text = "    { void game_shadow_matrix_built(uint8_t*, recomp_context*); game_shadow_matrix_built(rdram, ctx); }"

# Shadow alpha (112/255) is in $f10 here; the delay slot stores it at rider + 0x9F4
# and the call hands the color to the scene.
[[patches.hook]]
func = "bootup_00CFA0"
before_vram = 0x8100D328
text = "    { void game_shadow_alpha(uint8_t*, recomp_context*); game_shadow_alpha(rdram, ctx); }"

# Render mode lookups for a material's draw mode (cycle 1 and cycle 2), done
# when a course loads; the result is in $v0. shadows.cpp gives the mode used
# for the picture of the board under each rider (0x41C8, no depth test) a
# depth test.
[[patches.hook]]
func = "bootup_06A814"
before_vram = 0x8106AA6C
text = "    { void game_board_mark_render_mode(uint8_t*, recomp_context*); game_board_mark_render_mode(rdram, ctx); }"

[[patches.hook]]
func = "bootup_06AA78"
before_vram = 0x8106ABE0
text = "    { void game_board_mark_render_mode(uint8_t*, recomp_context*); game_board_mark_render_mode(rdram, ctx); }"

# The rider update has the course scale in $f6 here (shadows.cpp needs it to
# measure the rider's height above the ground at draw time).
[[patches.hook]]
func = "bootup_00C234"
before_vram = 0x8100C3C8
text = "    { void game_shadow_scale(uint8_t*, recomp_context*); game_shadow_scale(rdram, ctx); }"

# RCP task manager (rcpMgrThread), on an SP task done message: when it asked the
# running graphics task to yield, it reads the current graphics task to record
# whether it yielded. The runtime always finishes graphics tasks rather than
# yielding them, and in testing the message once arrived with no current task,
# crashing on a null pointer as a demo race started. Treat that case as an
# ordinary task done.
[[patches.hook]]
func = "bootup_061CF4"
before_vram = 0x81061E70
text = "    if (ctx->r20 != 0 && MEM_W(0xC, ctx->r16) == 0) { ctx->r20 = 0; }"
